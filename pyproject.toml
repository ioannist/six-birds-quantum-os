[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sbqos"
version = "1.0.0"
description = "Closure-certified logical qubit simulation prototype (Six Birds Theory instantiated on quantum error correction)"
requires-python = ">=3.10"
authors = [{ name = "Ioannis Tsiokos", email = "ioannis@automorph.io" }]
readme = "README.md"
keywords = ["quantum error correction", "emergence", "emergence calculus", "Six Birds Theory", "adequacy residual", "existence certificate", "pre-registered predictions", "drift detection", "decoder recalibration", "reproducible simulation"]
# Lower bounds match the exact versions this project was built and tested against
# (see REPORT.md's reproduction section for the full known-good environment record,
# added after an external review flagged missing environment pinning as a reproduction risk).
dependencies = [
    "numpy>=2.2",
    "scipy>=1.15",
    "stim>=1.16",
    "pymatching>=2.4",
    "matplotlib>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Repository = "https://github.com/ioannist/six-birds-quantum-os"
Paper = "https://doi.org/10.5281/zenodo.22337886"
